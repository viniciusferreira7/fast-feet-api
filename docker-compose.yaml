services:
  fast-feet-api-postgresql:
    container_name: fast-feet-api-postgresql
    image: postgres:17.2
    ports:
      - ${DATABASE_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - fast-feet-api-network
    volumes:
      - fast_feet_api_pg_data:/var/lib/postgresql/data

networks:
  fast-feet-api-network:
    driver: bridge

volumes:
  fast_feet_api_pg_data:
