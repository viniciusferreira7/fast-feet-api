pre-commit:
  parallel: true

  commands:
    lint:
      run: pnpm check:fix

    typecheck:
      run: pnpm check:type

pre-push:
  parallel: true

  commands:
    pull:
      run: git pull origin $(git branch --show-current)

    lint:
      run: pnpm check:fix

    typecheck:
      run: pnpm check:type

    tests:
      run: pnpm test:unit && pnpm test:int && pnpm test:e2e