pre-commit:
  parallel: true

  commands:
    lint:
      run: pnpm check:fix

    typecheck:
      run: pnpm check:type

pre-push:
  parallel: true

  commands:
    pull:
      run: git pull origin $(git branch --show-current)

    lint:
      run: pnpm check:fix

    typecheck:
      run: pnpm check:type

    unit-tests:
      run: pnpm test:unit

    integration-tests:
      run: pnpm test:int

    e2e-tests:
      run: pnpm test:e2e